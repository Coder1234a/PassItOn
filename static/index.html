<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A1333">
  <title>PassItOn</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="phone">
    <header id="topbar" hidden></header>
    <main id="view" tabindex="-1"></main>
    <nav id="tabbar" hidden aria-label="Main"></nav>
    <div id="sheet-backdrop" hidden></div>
    <section id="sheet" role="dialog" aria-modal="true" hidden></section>
    <div id="overlay" hidden></div>
    <div id="tour" role="dialog" aria-modal="true" aria-label="How PassItOn works" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
